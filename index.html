<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KindPulse ($KPUN) - The Heartbeat of Decentralized Giving</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --solana-purple: #9945ff;
      --solana-green: #14f195;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header & Nav */
    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 11, 16, 0.8);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--solana-purple), var(--solana-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    /* Social Icons in Header */
    .header-socials {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .social-icn {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
    }

    .social-icn:hover {
      color: var(--solana-green);
      transform: translateY(-2px);
    }

    .social-icn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Hero Section */
    .hero {
      padding: 100px 0 60px;
      text-align: center;
      position: relative;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 24px;
    }

    .hero-title span {
      background: linear-gradient(135deg, var(--solana-purple), var(--solana-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 36px;
    }

    .cta-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--solana-purple), #7928ca);
      color: #fff;
      box-shadow: 0 4px 20px rgba(153, 69, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(153, 69, 255, 0.4);
    }

    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Contract Address Box */
    .ca-box {
      margin-top: 36px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      color: var(--text-muted);
      backdrop-filter: blur(8px);
    }

    .ca-title {
      color: var(--solana-green);
      font-weight: 600;
    }

    .ca-value {
      font-family: monospace;
      color: var(--text-main);
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .copy-btn:hover {
      color: var(--solana-green);
    }

    /* Section Styling */
    section {
      padding: 80px 0;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 48px;
    }

    /* Feature Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 32px;
      border-radius: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(153, 69, 255, 0.4);
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-text {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Tokenomics Table */
    .tokenomics-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      font-size: 1rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Whitepaper Article Card */
    .wp-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px;
    }

    .wp-card h3 {
      font-size: 1.4rem;
      color: var(--solana-green);
      margin: 28px 0 12px;
    }

    .wp-card h3:first-child {
      margin-top: 0;
    }

    .wp-card p {
      color: var(--text-muted);
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .wp-card ul {
      margin-left: 20px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .wp-card li {
      margin-bottom: 8px;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--card-border);
      padding: 40px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2.5rem;
      }
      .nav-links {
        display: none;
      }
      .wp-card {
        padding: 24px;
      }
    }
  </style>
</head>
